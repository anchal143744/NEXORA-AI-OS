services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_staging}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-managed-secret}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - nexora_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora_staging}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexora-redis-staging
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - nexora_staging_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nexora-minio-staging
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-managed-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - nexora_staging_minio:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexora-api-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-replace-with-managed-secret}@postgres:5432/${POSTGRES_DB:-nexora_staging}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${API_PORT:-4000}:4000'

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexora-worker-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-replace-with-managed-secret}@postgres:5432/${POSTGRES_DB:-nexora_staging}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_started

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.ai-worker
    container_name: nexora-ai-worker-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-replace-with-managed-secret}@postgres:5432/${POSTGRES_DB:-nexora_staging}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXORA_API_INTERNAL_URL: http://api:4000
    container_name: nexora-web-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: /api
      NEXORA_API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-3000}:3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora-nginx-staging
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./infra/nginx/nexora.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  nexora_staging_postgres:
  nexora_staging_redis:
  nexora_staging_minio:
