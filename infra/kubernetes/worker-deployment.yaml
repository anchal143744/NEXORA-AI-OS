apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-worker
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-worker
    app.kubernetes.io/part-of: nexora
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-worker
        app.kubernetes.io/part-of: nexora
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/nexora-ai/worker:3.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nexora-config
            - secretRef:
                name: nexora-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"