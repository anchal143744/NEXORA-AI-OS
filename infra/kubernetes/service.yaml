apiVersion: v1
kind: Service
metadata:
  name: nexora-api
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexora-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-redis
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-redis
spec:
  type: ClusterIP
  selector:
    app: nexora-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379