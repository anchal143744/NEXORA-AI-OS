apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-ingress
  namespace: nexora
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nexora.example.com
      secretName: nexora-tls
  rules:
    - host: api.nexora.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexora-api
                port:
                  number: 4000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: nexora-api
                port:
                  number: 4000