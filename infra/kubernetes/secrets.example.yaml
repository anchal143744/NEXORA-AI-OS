apiVersion: v1
kind: Secret
metadata:
  name: nexora-secrets
  namespace: nexora
type: Opaque
stringData:
  DATABASE_URL: "postgresql://nexora:change-me@nexora-postgres:5432/nexora?schema=public"
  REDIS_URL: "redis://:change-me@nexora-redis:6379"
  JWT_SECRET: "change-me-64-character-production-jwt-secret"
  JWT_REFRESH_SECRET: "change-me-64-character-production-refresh-secret"
  NEXORA_SECRET_KEY: "change-me-64-character-application-encryption-secret"
  OPENAI_API_KEY: "change-me"
  S3_ACCESS_KEY_ID: "change-me"
  S3_SECRET_ACCESS_KEY: "change-me"